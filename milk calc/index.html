<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Price Calculator</title>
    <style>
        /* --- General Styles --- */
        :root {
            --primary-color: #4CAF50; /* Green */
            --secondary-color: #8BC34A; /* Light Green */
            --background-color: #f4f7f6;
            --card-background: #ffffff;
            --text-dark: #333333;
            --text-light: #777777;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-background);
            border-radius: 12px;
            box-shadow: 0 8px 20px var(--shadow-color);
            padding: 30px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
        }

        /* --- Table and Product Styles --- */
        .product-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 15px; /*vertical spacing between rows*/
            margin-bottom: 30px;
        }

        .product-item {
            background-color: var(--card-background);
            border-radius: 10px;
            box-shadow: 0 4px 12px var(--shadow-color);
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            border: 1px solid var(--border-color);
        }

        .product-item.active {
            transform: scale(1.01);
            box-shadow: 0 6px 16px rgba(76, 175, 80, 0.2); /* Highlight with primary color shadow */
        }

        .product-item td {
            padding: 18px 20px;
            text-align: left;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
        }

        .product-item td:first-child {
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            border-left: 1px solid var(--border-color);
        }

        .product-item td:last-child {
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
            border-right: 1px solid var(--border-color);
        }

        /* Ensure the last row always looks a bit different if rounded corners cause issues */
        .product-item:last-of-type td {
             border-bottom: none; /* No bottom border for the last item in the table */
        }
         .product-item:last-of-type td:first-child {
             border-bottom-left-radius: 10px;
         }
        .product-item:last-of-type td:last-child {
            border-bottom-right-radius: 10px;
        }


        .product-name {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 1.05em;
        }

        .product-details {
            font-size: 0.9em;
            color: var(--text-light);
        }

        .fixed-price {
            font-weight: 500;
            color: var(--primary-color);
            white-space: nowrap;
        }

        input[type="number"] {
            width: 80px;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: center;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            -moz-appearance: textfield; /* Firefox */
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }

        .subtotal {
            font-weight: 500;
            color: var(--text-dark);
            min-width: 80px; /* Ensure space for values */
            text-align: right;
        }

        /* --- Summary Section --- */
        .summary-section {
            margin-top: 30px;
            background-color: var(--secondary-color);
            color: white;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(139, 195, 74, 0.3); /* Light green shadow */
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
        }

        .summary-item {
            text-align: center;
            flex: 1;
            min-width: 120px; /* Ensure items don't get too squished */
        }

        .summary-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .summary-value {
            font-size: 1.6em;
            font-weight: 700;
            white-space: nowrap;
        }

        /* --- Buttons --- */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 7px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            outline: none;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0px);
        }

        .reset-button {
            background-color: #f44336; /* Red */
            color: white;
        }
        .reset-button:hover {
            background-color: #d32f2f;
        }

        .print-button {
            background-color: #2196F3; /* Blue */
            color: white;
        }
        .print-button:hover {
            background-color: #1976D2;
        }


        /* --- Print Styles --- */
        @media print {
            body {
                padding: 0;
                margin: 0;
                background-color: white;
                box-shadow: none;
            }
            .container {
                width: 100%;
                max-width: 100%;
                box-shadow: none;
                padding: 0;
                margin: 0;
            }
            h1 {
                font-size: 2em;
                margin-bottom: 20px;
            }
            .product-table, .summary-section, .button-container {
                margin-bottom: 20px;
            }
            .product-item {
                box-shadow: none;
                border: 1px solid var(--border-color); /* Ensure borders are visible */
                margin-bottom: 10px; /* Add space between printed items */
            }
            .product-item td {
                border-bottom: 1px solid var(--border-color);
                 padding: 10px 15px;
            }
             .product-item:last-of-type td {
                 border-bottom: none;
            }

            input[type="number"] {
                border: 1px solid var(--border-color);
                padding: 8px 10px;
                width: 70px;
            }

            .summary-section {
                background-color: #eee; /* Lighter background for print */
                color: var(--text-dark);
                flex-direction: column; /* Stack items vertically */
                align-items: flex-start;
            }

            .summary-item {
                text-align: left;
                margin-bottom: 10px;
                min-width: auto;
                width: 100%;
            }

            .summary-label {
                opacity: 1;
                font-weight: bold;
            }

            .summary-value {
                font-size: 1.3em;
            }

            .button-container {
                display: none; /* Hide control buttons during print */
            }

            /* Hide specific elements not needed for print */
            .container :not(h1):not(.product-table):not(.summary-section):not(.product-item):not(td):not(input):not(.summary-label):not(.summary-value) {
                display: none !important;
            }
        }

        /* --- Responsive Design --- */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.8em;
            }
            .product-item td {
                padding: 12px 15px;
                font-size: 0.95em;
            }
            input[type="number"] {
                width: 65px;
                padding: 8px 10px;
                font-size: 0.9em;
            }
            .summary-section {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }
            .summary-item {
                min-width: unset;
                width: 100%;
            }
            .summary-value {
                font-size: 1.4em;
            }
            .button-container {
                flex-direction: column;
                gap: 15px;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>

    <script>
        // --- Product Data ---
        // This array holds the fixed product details.
        // If you need to add/remove/edit products, modify this array.
        const products = [
            { id: 'gold_1l', name: 'Gold Milk', details: '1 Litre', basePrice: 65.70 },
            { id: 'gold_0.5l', name: 'Gold Milk', details: 'Half Litre', basePrice: 67.70 }, // Note: Specs said Half Litre is more expensive than 1L for Gold.
            { id: 'shakti_1l', name: 'Shakti Milk', details: '1 Litre', basePrice: 57.70 },
            { id: 'shakti_0.5l', name: 'Shakti Milk', details: 'Half Litre', basePrice: 59.70 },
            { id: 'cow_0.5l', name: 'Cow Milk', details: 'Half Litre', basePrice: 55.70 }
        ];

        // --- DOM Elements ---
        const productListElement = document.getElementById('product-list');
        const totalProductsElement = document.getElementById('total-products');
        const totalQuantityElement = document.getElementById('total-quantity');
        const grandTotalElement = document.getElementById('grand-total');

        // --- State Variables ---
        let currentQuantities = {}; // Stores current quantity for each product ID

        // --- Initialization ---
        function initializeCalculator() {
            // Populate product list table
            let htmlContent = '';
            products.forEach((product, index) => {
                // Store initial quantity as 0
                currentQuantities[product.id] = 0;

                htmlContent += `
                    <tr class="product-item" id="item-${product.id}">
                        <td>
                            <div class="product-name">${product.name}</div>
                            <div class="product-details">${product.details}</div>
                        </td>
                        <td class="fixed-price">₹${product.basePrice.toFixed(2)}</td>
                        <td>
                            <input
                                type="number"
                                id="${product.id}-qty"
                                value="0"
                                min="0"
                                step="1"
                                data-product-id="${product.id}"
                                oninput="handleQuantityInput(event)"
                                onkeydown="handleKeyDown(event)"
                                aria-label="Quantity for ${product.name} ${product.details}"
                            >
                        </td>
                        <td class="subtotal" id="${product.id}-subtotal">₹0.00</td>
                    </tr>
                `;
            });
            productListElement.innerHTML = htmlContent;

            // Set focus to the first input field
            const firstInput = document.querySelector('input[type="number"]');
            if (firstInput) {
                firstInput.focus();
            }

            // Initial calculation and summary update
            updateSummary();
        }

        // --- Event Handlers ---

        /**
         * Handles input for quantity fields.
         * Validates input (numeric, non-negative), updates internal state,
         * and recalculates totals.
         * @param {Event} event - The input event.
         */
        function handleQuantityInput(event) {
            const inputElement = event.target;
            const productId = inputElement.dataset.productId;
            let quantity = parseInt(inputElement.value, 10);

            // Validation: Ensure it's a number and not negative
            if (isNaN(quantity) || quantity < 0) {
                quantity = 0;
                inputElement.value = '0'; // Reset invalid input to 0
            }

            // Update internal quantity state
            currentQuantities[productId] = quantity;

            // Update subtotal for this product
            updateSubtotal(productId);

            // Update overall summary
            updateSummary();

            // Highlight row if quantity > 0
            const rowElement = document.getElementById(`item-${productId}`);
            if (quantity > 0) {
                rowElement.classList.add('active');
            } else {
                rowElement.classList.remove('active');
            }
        }

        /**
         * Handles keydown events for quantity inputs.
         * Implements 'Enter' to move to the next field.
         * @param {Event} event - The keydown event.
         */
        function handleKeyDown(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevent default form submission if it were in a form
                const inputs = document.querySelectorAll('input[type="number"]');
                const currentIndex = Array.from(inputs).indexOf(event.target);
                const nextIndex = (currentIndex + 1) % inputs.length;
                inputs[nextIndex].focus();
            }
        }

        // --- Calculation and Update Functions ---

        /**
         * Updates the subtotal for a specific product.
         * @param {string} productId - The ID of the product.
         */
        function updateSubtotal(productId) {
            const product = products.find(p => p.id === productId);
            const quantity = currentQuantities[productId];
            const subtotal = quantity * product.basePrice;

            const subtotalElement = document.getElementById(`${productId}-subtotal`);
            subtotalElement.textContent = `₹${subtotal.toFixed(2)}`;
        }

        /**
         * Recalculates and updates the total products, total quantity, and grand total.
         */
        function updateSummary() {
            let totalQuantity = 0;
            let totalAmount = 0;
            let productsEnteredCount = 0;

            products.forEach(product => {
                const quantity = currentQuantities[product.id];
                totalQuantity += quantity;
                totalAmount += quantity * product.basePrice;

                if (quantity > 0) {
                    productsEnteredCount++;
                }
            });

            totalProductsElement.textContent = productsEnteredCount;
            totalQuantityElement.textContent = totalQuantity;
            grandTotalElement.textContent = `₹${totalAmount.toFixed(2)}`;
        }

        /**
         * Resets all quantity inputs to 0 and clears the summary totals.
         */
        function resetAll() {
            // Reset input values and internal state
            products.forEach(product => {
                const inputElement = document.getElementById(`${product.id}-qty`);
                inputElement.value = '0';
                currentQuantities[product.id] = 0;

                // Remove active class from rows
                const rowElement = document.getElementById(`item-${product.id}`);
                rowElement.classList.remove('active');
            });

            // Update summary to reflect reset state
            updateSummary();

            // Set focus back to the first input
            const firstInput = document.querySelector('input[type="number"]');
            if (firstInput) {
                firstInput.focus();
            }
        }

        // --- Initial Call ---
        // Initialize the calculator when the DOM is fully loaded
        document.addEventListener('DOMContentLoaded', initializeCalculator);

    </script>

</body>
</html>
